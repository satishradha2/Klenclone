[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "klen-clone"
version = "0.1.0"
description = "Independent BizModo clone, migration staging, and ERP preview service"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "alembic>=1.13,<2",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
klen-staging = "klen_clone.cli:main"
klen-erp = "klen_clone.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klen_clone = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: isolated PostgreSQL integration validation"]
