services:
  operational-database:
    image: postgres:17-alpine
    env_file:
      - .env.asas.operational.local
    volumes:
      - asas_operational_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klen_erp
      POSTGRES_USER: klen_erp
      POSTGRES_PASSWORD: ${KLEN_POSTGRES_PASSWORD:?Set KLEN_POSTGRES_PASSWORD}
    volumes:
      - klen_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klen_erp -d klen_erp"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    environment:
      KLEN_DATABASE_URL: postgresql+psycopg://klen_erp:${KLEN_POSTGRES_PASSWORD}@database:5432/klen_erp
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  control-center:
    build:
      context: .
      target: runtime
    environment:
      KLEN_DATABASE_URL: postgresql+psycopg://klen_erp:${KLEN_POSTGRES_PASSWORD}@database:5432/klen_erp
      KLEN_SNAPSHOT: ${KLEN_SNAPSHOT:-bizmodo-2026-09-08-browser}
      KLEN_AUTH_ENABLED: "false"
      KLEN_PRODUCTION_MODE: "false"
      KLEN_TOKEN_TTL_SECONDS: "1800"
    ports:
      - "127.0.0.1:${KLEN_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  erp-preview:
    build:
      context: .
      target: runtime
    env_file:
      - .env.asas.local
      - .env.asas.operational.local
    environment:
      KLEN_DATABASE_URL: postgresql+psycopg://klen_erp:${KLEN_POSTGRES_PASSWORD}@database:5432/klen_erp
      KLEN_SNAPSHOT: ${KLEN_SNAPSHOT:-bizmodo-2026-09-08-browser}
      ASAS_DELTA_CAPTURE: /evidence/current
      ASAS_USERS_FILE: /run/asas-secrets/users.json
    command: ["python", "-m", "uvicorn", "klen_clone.erp_preview:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header"]
    ports:
      - "127.0.0.1:${ASAS_ERP_PREVIEW_PORT:-18082}:8080"
    volumes:
      - ./source_exports/2026-09-10-frozen-browser-cutover:/evidence/current:ro
      - ./source_exports/2026-09-09-reconciliation-20260909T101320Z:/evidence/reconciled-stock:ro
      - ./var/erp_reconciliation_refreshes/20260909T101320Z/package/PACKAGE_STATUS.json:/evidence/reconciled-stock-status.json:ro
      - ./.secrets/asas-users.json:/run/asas-secrets/users.json:ro
    depends_on:
      database:
        condition: service_healthy
      operational-database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  integration-test:
    profiles: ["validation"]
    build:
      context: .
      target: test
    environment:
      KLEN_TEST_DATABASE_URL: postgresql+psycopg://klen_erp:${KLEN_POSTGRES_PASSWORD}@database:5432/klen_erp
      KLEN_AUTH_ENABLED: "true"
      KLEN_AUTH_SECRET: ${KLEN_TEST_AUTH_SECRET:-synthetic-validation-secret-at-least-32-characters}
      KLEN_PRODUCTION_MODE: "false"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/integration"]
    restart: "no"

  copy-clone:
    profiles: ["real-copy"]
    build:
      context: .
      target: runtime
    environment:
      KLEN_DATABASE_URL: postgresql+psycopg://klen_erp:${KLEN_POSTGRES_PASSWORD}@database:5432/klen_erp
    command: ["python", "-m", "klen_clone.cli", "copy-db", "--source-url", "sqlite:////source/klen_staging.db"]
    volumes:
      - ./var/klen_staging.db:/source/klen_staging.db:ro
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  klen_postgres:
  asas_operational_postgres:
